spring:
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-ai.xml
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

# =============================================================================
# AI CONFIGURATION (Database-Backed LLM Hierarchy)
# =============================================================================
llm:
  default-chat-key: ${AI_DEFAULT_CHAT_MODEL_KEY:openrouter_gemma31b}
  default-embedding-key: ${AI_DEFAULT_EMBEDDING_MODEL_KEY:cohere_embed_multilingual_v3}

# =============================================================================
# CHATBOT AI & EXTERNAL SCHEMA CONFIGURATION
# =============================================================================
chatbot:
  debug: ${CHATBOT_DEBUG:false}
  schema:
    # Static file path for the EXTERNAL real estate database (fallback when dynamic loading is disabled)
    path: classpath:db/external/v1_real_estate_schema_ddl.sql
    # Dynamic schema loading configuration (connects to the external target database)
    datasource:
      active: ${SCHEMA_DATASOURCE_ACTIVE:false}
      postgres:
        enabled: ${SCHEMA_POSTGRES_ENABLED:false}
        url: ${SCHEMA_POSTGRES_URL:}
        username: ${SCHEMA_POSTGRES_USERNAME:}
        password: ${SCHEMA_POSTGRES_PASSWORD:}
        schema: ${SCHEMA_POSTGRES_SCHEMA:public}
        include-tables: ${SCHEMA_POSTGRES_INCLUDE_TABLES:}
        exclude-tables: ${SCHEMA_POSTGRES_EXCLUDE_TABLES:}
        include-comments: ${SCHEMA_POSTGRES_INCLUDE_COMMENTS:true}
        include-relationships: ${SCHEMA_POSTGRES_INCLUDE_Relationships:true}
        cache-ttl-seconds: ${SCHEMA_CACHE_TTL:3600}
        pool-size: ${SCHEMA_POOL_SIZE:2}
  prompts:
    path: classpath:prompts/
    auto-load: true

# =============================================================================
# LOGGING (Set LOG_LEVEL=DEBUG in .env for testing flow, INFO in production)
# =============================================================================
logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    semsem.chatbot: ${LOG_LEVEL:INFO}
    semsem.chatbot.llm: ${LLM_LOG_LEVEL:${LOG_LEVEL:INFO}}
    semsem.chatbot.orchestration: ${ORCHESTRATION_LOG_LEVEL:${LOG_LEVEL:INFO}}
    semsem.chatbot.sql: ${SQL_LOG_LEVEL:${LOG_LEVEL:INFO}}
    semsem.chatbot.schema: ${SCHEMA_LOG_LEVEL:${LOG_LEVEL:INFO}}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:WARN}

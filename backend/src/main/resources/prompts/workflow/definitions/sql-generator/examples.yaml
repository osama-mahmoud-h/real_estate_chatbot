examples:
  - user_query: "Find me 3-bedroom apartments in Miami under $500k"
    sql: >
      SELECT p.property_id, p.title, p.property_type, p.listing_type, p.price,
      p.city, p.state, p.bedrooms, p.bathrooms, p.area_sqft, p.address,
      pi.image_url as primary_image
      FROM properties p
      LEFT JOIN property_images pi ON p.property_id = pi.property_id AND pi.is_primary = true
      WHERE p.property_status = 'active'
      AND p.property_type = :property_type::property_type_enum
      AND LOWER(p.city) = LOWER(:city)
      AND p.bedrooms = :bedrooms
      AND p.price <= :max_price
      ORDER BY p.listed_date DESC LIMIT :limit

  - user_query: "What's the average price of houses in California?"
    sql: >
      SELECT COUNT(*) as total_count,
      ROUND(AVG(price)::numeric, 2) as avg_price,
      MIN(price) as min_price,
      MAX(price) as max_price,
      ROUND(AVG(area_sqft)::numeric, 2) as avg_sqft
      FROM properties
      WHERE property_status = 'active'
      AND property_type = :property_type::property_type_enum
      AND LOWER(state) = LOWER(:state)

  - user_query: "Show me details for property 456"
    sql: >
      SELECT p.*, u.first_name, u.last_name, u.email as owner_email,
      u.phone as owner_phone, a.agency_name, a.rating as agent_rating,
      a.years_experience,
      (SELECT json_agg(json_build_object('url', image_url, 'is_primary', is_primary))
       FROM property_images WHERE property_id = p.property_id) as images,
      (SELECT json_agg(f.feature_name)
       FROM property_features pf JOIN features f ON pf.feature_id = f.feature_id
       WHERE pf.property_id = p.property_id) as features
      FROM properties p
      JOIN users u ON p.owner_id = u.user_id
      LEFT JOIN agents a ON p.agent_id = a.agent_id
      WHERE p.property_id = :property_id

  - user_query: "Find rentals in New York with 2+ bedrooms and a pool and gym"
    sql: >
      SELECT p.property_id, p.title, p.property_type, p.listing_type, p.price,
      p.city, p.state, p.bedrooms, p.bathrooms, p.area_sqft
      FROM properties p
      JOIN property_features pf ON p.property_id = pf.property_id
      JOIN features f ON pf.feature_id = f.feature_id
      WHERE p.property_status = 'active'
      AND p.listing_type = :listing_type::listing_type_enum
      AND LOWER(p.city) = LOWER(:city)
      AND p.bedrooms >= :min_bedrooms
      AND f.feature_name IN (:features)
      GROUP BY p.property_id
      HAVING COUNT(DISTINCT f.feature_name) = :feature_count
      ORDER BY p.listed_date DESC LIMIT :limit

  - user_query: "Compare properties 101 and 202"
    sql: >
      SELECT p.property_id, p.title, p.property_type, p.price,
      p.city, p.state, p.bedrooms, p.bathrooms, p.area_sqft
      FROM properties p
      WHERE p.property_id IN (:property_ids)

  - user_query: "Show me the latest listings"
    sql: >
      SELECT p.property_id, p.title, p.property_type, p.price,
      p.city, p.state, p.bedrooms, p.bathrooms, p.area_sqft
      FROM properties p
      WHERE p.property_status = 'active'
      ORDER BY p.listed_date DESC
      LIMIT :limit
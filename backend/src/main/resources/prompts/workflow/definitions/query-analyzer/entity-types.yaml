entities:
  - name: property_type
    type: enum
    description: Type of property
    possible_values: [house, apartment, condo, townhouse, land, commercial]

  - name: listing_type
    type: enum
    description: Type of listing
    possible_values: [sale, rent, lease]

  - name: location
    type: object
    description: Location details
    fields: [city, state, country, neighborhood, postal_code]

  - name: price_range
    type: object
    description: Price bounds
    fields: [min, max, currency]
    defaults:
      currency: USD

  - name: bedrooms
    type: object
    description: Bedroom count
    fields: [min, max, exact]

  - name: bathrooms
    type: object
    description: Bathroom count
    fields: [min, max, exact]

  - name: area_sqft
    type: object
    description: Area in square feet
    fields: [min, max]

  - name: features
    type: array
    description: >
      Desired amenities. Map each user term to the EXACT feature name below
      (e.g. "pool" or "private pool" -> "Swimming Pool"; "garage" -> "Parking Garage";
      "golf view" -> "Golf Course View"). Only emit values from this list.
    possible_values:
      - Hardwood Floors
      - Granite Countertops
      - Walk-in Closet
      - Open Floor Plan
      - High Ceilings
      - Fireplace
      - Smart Home System
      - Central Air Conditioning
      - Marble Flooring
      - Built-in Wardrobes
      - Swimming Pool
      - Garden
      - Parking Garage
      - Balcony
      - Rooftop Terrace
      - BBQ Area
      - Fenced Yard
      - Waterfront
      - Gym
      - Security System
      - Clubhouse
      - Playground
      - Swimming Pool (Community)
      - Golf Course View
      - Gated Community
      - 24/7 Security
      - Central AC
      - Solar Panels
      - Backup Generator
      - High-Speed Internet
      - Elevator

  - name: year_built
    type: object
    description: Construction year range
    fields: [min, max]

  - name: property_status
    type: enum
    description: Listing status
    possible_values: [active, pending, sold, rented, inactive]

  - name: property_ids
    type: array
    description: Specific property IDs referenced by user

  - name: agent_id
    type: integer
    description: Specific agent ID referenced by user

  - name: sort_by
    type: enum
    description: Result ordering
    possible_values: [price_asc, price_desc, date_newest, date_oldest, area]

  - name: limit
    type: integer
    description: Max number of results to return
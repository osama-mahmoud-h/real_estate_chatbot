services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: real-estate-chatbot
    ports:
      - "8080:8080"
    # Credentials, model selection and chatbot settings all come from backend/.env.
    env_file:
      - backend/.env
    # Only the values that differ inside the container network are overridden here;
    # `environment` wins over `env_file`.
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-real_estate_chatbot_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      SCHEMA_POSTGRES_URL: jdbc:postgresql://postgres:5432/real_estate_db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-real_estate_chatbot_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # Read by init-db.sql; a subdirectory is not auto-executed by the entrypoint.
      - ./backend/core-ai/src/main/resources/db:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      # psql (unlike pg_isready) fails when the database itself is missing.
      test: ["CMD-SHELL", "psql -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-real_estate_chatbot_db} -c 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network
    restart: unless-stopped

networks:
  chatbot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

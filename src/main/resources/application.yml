spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: real-estate-chatbot

  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:chatbot_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# =============================================================================
# AI CONFIGURATION (LLM Independent Architecture)
# =============================================================================
llm:
  # ---------------------------------------------------------------------------
  # MODEL SELECTION (which provider + model to use)
  # ---------------------------------------------------------------------------
  chat:
    provider: ${AI_CHAT_PROVIDER:ollama}
    model: ${AI_CHAT_MODEL:llama3.2}
    temperature: ${AI_CHAT_TEMPERATURE:0.7}
    max-tokens: ${AI_CHAT_MAX_TOKENS:4096}
    top-p: ${AI_CHAT_TOP_P:0.95}

  embedding:
    provider: ${AI_EMBEDDING_PROVIDER:ollama}
    model: ${AI_EMBEDDING_MODEL:nomic-embed-text}

  # ---------------------------------------------------------------------------
  # PROVIDERS & MODELS WITH CAPABILITIES
  # ---------------------------------------------------------------------------
  providers:
    # -------------------------------------------------------------------------
    # GEMINI
    # -------------------------------------------------------------------------
    gemini:
      api-key: ${GOOGLE_AI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      models:
        # Chat Models
        gemini-2.5-flash:
          type: chat
          context-window: 1048576
          max-output-tokens: 8192
          capabilities:
            - streaming
            - function-calling
            - vision
            - json-mode
            - system-prompt
        gemini-1.5-pro:
          type: chat
          context-window: 2097152
          max-output-tokens: 8192
          capabilities:
            - streaming
            - function-calling
            - vision
            - json-mode
            - system-prompt
        gemini-1.5-flash:
          type: chat
          context-window: 1048576
          max-output-tokens: 8192
          capabilities:
            - streaming
            - function-calling
            - vision
            - json-mode
            - system-prompt
        # Embedding Models
        text-embedding-004:
          type: embedding
          dimensions: 768
          max-input-tokens: 2048
          capabilities:
            - batch

    # -------------------------------------------------------------------------
    # COHERE
    # -------------------------------------------------------------------------
    cohere:
      api-key: ${COHERE_API_KEY:}
      base-url: ${COHERE_BASE_URL:https://api.cohere.ai}
      models:
        # Chat Models
        command-r-plus:
          type: chat
          context-window: 128000
          max-output-tokens: 4096
          capabilities:
            - streaming
            - function-calling
            - rag
            - system-prompt
        command-r:
          type: chat
          context-window: 128000
          max-output-tokens: 4096
          capabilities:
            - streaming
            - function-calling
            - rag
            - system-prompt
        command-light:
          type: chat
          context-window: 4096
          max-output-tokens: 4096
          capabilities:
            - streaming
            - system-prompt
        # Embedding Models
        embed-english-v3.0:
          type: embedding
          dimensions: 1024
          max-input-tokens: 512
          capabilities:
            - batch
            - search-document
            - search-query
        embed-multilingual-v3.0:
          type: embedding
          dimensions: 1024
          max-input-tokens: 512
          capabilities:
            - batch
            - multilingual
            - search-document
            - search-query
        embed-english-light-v3.0:
          type: embedding
          dimensions: 384
          max-input-tokens: 512
          capabilities:
            - batch

    # -------------------------------------------------------------------------
    # OLLAMA (Local)
    # -------------------------------------------------------------------------
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      models:
        # Chat Models
        llama3.2:
          type: chat
          context-window: 131072
          max-output-tokens: 4096
          capabilities:
            - streaming
            - function-calling
            - system-prompt
        mistral:
          type: chat
          context-window: 32768
          max-output-tokens: 4096
          capabilities:
            - streaming
            - function-calling
            - system-prompt
        codellama:
          type: chat
          context-window: 16384
          max-output-tokens: 4096
          capabilities:
            - streaming
            - code-generation
            - system-prompt
        qwen2.5:
          type: chat
          context-window: 32768
          max-output-tokens: 4096
          capabilities:
            - streaming
            - function-calling
            - system-prompt
        llava:
          type: chat
          context-window: 4096
          max-output-tokens: 4096
          capabilities:
            - streaming
            - vision
            - system-prompt
        # Embedding Models
        nomic-embed-text:
          type: embedding
          dimensions: 768
          max-input-tokens: 8192
          capabilities:
            - batch
        mxbai-embed-large:
          type: embedding
          dimensions: 1024
          max-input-tokens: 512
          capabilities:
            - batch
        all-minilm:
          type: embedding
          dimensions: 384
          max-input-tokens: 256
          capabilities:
            - batch

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVNlY3VyZUtleUZvckpXVFRva2VuR2VuZXJhdGlvbkluUHJvZHVjdGlvblVzZUVudmlyb25tZW50VmFyaWFibGU=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server:
  port: ${SERVER_PORT:8080}

# =============================================================================
# CHATBOT CONFIGURATION
# =============================================================================
chatbot:
  debug: ${CHATBOT_DEBUG:false}
  schema:
    path: classpath:db/v1_real_estate_schema_ddl.sql
  prompts:
    path: classpath:prompts/
    auto-load: true

# =============================================================================
# LOGGING
# =============================================================================
logging:
  level:
    root: INFO
    semsem.chatbot: ${LOG_LEVEL:INFO}